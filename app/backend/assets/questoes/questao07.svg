<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Descobrir juntos o que importa</title><desc id="desc">Pedido inicial: O parceiro solicita uma área de estudos para o portal.; Conversa sobre uma versão: Parceiro e equipe experimentam a área e identificam a necessidade de filtrar por tema.; Decisão conjunta: Ambos esclarecem o resultado esperado e combinam a próxima entrega.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#7c3aed"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Descobrir juntos o que importa</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#7c3aed"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Pedido inicial</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O parceiro solicita uma</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">área de estudos para o</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">portal.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#7c3aed"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Conversa sobre uma</text><text x="450" y="315" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">versão</text><text x="450" y="368" font-family="Arial,sans-serif" font-size="22" fill="#334155">Parceiro e equipe</text><text x="450" y="399" font-family="Arial,sans-serif" font-size="22" fill="#334155">experimentam a área e</text><text x="450" y="430" font-family="Arial,sans-serif" font-size="22" fill="#334155">identificam a</text><text x="450" y="461" font-family="Arial,sans-serif" font-size="22" fill="#334155">necessidade de filtrar</text><text x="450" y="492" font-family="Arial,sans-serif" font-size="22" fill="#334155">por tema.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#7c3aed"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Decisão conjunta</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Ambos esclarecem o</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">resultado esperado e</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">combinam a próxima</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">entrega.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Manifesto Ágil • Questão 3 • Analise as informações do cenário.</text></svg>