<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Uma nova condição externa</title><desc id="desc">Plano inicial: A validação do certificado dependeria de um serviço externo.; Mudança externa: O fornecedor informa que o serviço deixará de estar disponível.; Replanejamento: A equipe analisa o impacto e prioriza uma página própria de validação por QR Code.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#7c3aed"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Uma nova condição externa</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#7c3aed"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Plano inicial</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A validação do</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">certificado dependeria</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">de um serviço externo.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#7c3aed"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Mudança externa</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O fornecedor informa que</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">o serviço deixará de</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">estar disponível.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#7c3aed"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Replanejamento</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe analisa o</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">impacto e prioriza uma</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">página própria de</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">validação por QR Code.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Manifesto Ágil • Questão 4 • Analise as informações do cenário.</text></svg>