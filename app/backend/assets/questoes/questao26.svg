<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Um resultado que pode ser verificado</title><desc id="desc">História: Como candidato, quero consultar meu histórico para acompanhar meu desempenho.; Dados de teste: O candidato autenticado concluiu duas avaliações, com notas 50% e 75%.; Resultado esperado: A tela deve apresentar as duas avaliações com suas respectivas notas.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#b45309"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Um resultado que pode ser verificado</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#b45309"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">História</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Como candidato, quero</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">consultar meu histórico</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">para acompanhar meu</text><text x="72" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">desempenho.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#b45309" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#b45309"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Dados de teste</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">O candidato autenticado</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">concluiu duas avaliações,</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">com notas 50% e 75%.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#b45309" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#b45309"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Resultado esperado</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">A tela deve apresentar as</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">duas avaliações com suas</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">respectivas notas.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 7: User Stories • Questão 2</text></svg>