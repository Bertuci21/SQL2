<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Um limite merece testes específicos</title><desc id="desc">Regra do produto: Aprovação com aproveitamento igual ou superior a 65%.; Unidade em teste: Uma função isolada recebe o percentual calculado e decide se há aprovação.; Casos propostos: Percentuais 64,99%, 65% e 65,01% são fornecidos diretamente à função.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#5b21b6"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Um limite merece testes específicos</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#5b21b6"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Regra do produto</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Aprovação com</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">aproveitamento igual ou</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">superior a 65%.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#5b21b6" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#5b21b6"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Unidade em teste</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Uma função isolada recebe</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">o percentual calculado e</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">decide se há aprovação.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#5b21b6" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#5b21b6"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Casos propostos</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Percentuais 64,99%, 65% e</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">65,01% são fornecidos</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">diretamente à função.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 12: Qualidade em Projetos Ágeis • Questão 1</text></svg>