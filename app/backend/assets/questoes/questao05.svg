<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Um bloqueio entre colegas</title><desc id="desc">Situação: A tarefa está registrada, mas há dúvida sobre a regra de aprovação.; Interação: Dois integrantes conversam com o responsável pelo produto e esclarecem a regra.; Registro: A equipe atualiza a tarefa e continua a implementação.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#7c3aed"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Um bloqueio entre colegas</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#7c3aed"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Situação</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A tarefa está</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">registrada, mas há</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">dúvida sobre a regra de</text><text x="72" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">aprovação.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#7c3aed"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Interação</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Dois integrantes</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">conversam com o</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">responsável pelo produto</text><text x="450" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">e esclarecem a regra.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#7c3aed"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Registro</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe atualiza a</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">tarefa e continua a</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">implementação.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Manifesto Ágil • Questão 1 • Analise as informações do cenário.</text></svg>