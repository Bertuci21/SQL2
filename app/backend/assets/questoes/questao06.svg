<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Duas evidências de progresso</title><desc id="desc">Equipe Aurora: Apresenta um relatório extenso e telas sem comportamento implementado.; Equipe Horizonte: Demonstra uma avaliação utilizável que calcula e exibe a nota.; Próximo passo: Horizonte mantém instruções essenciais e recolhe feedback da demonstração.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#7c3aed"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Duas evidências de progresso</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#7c3aed"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Equipe Aurora</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Apresenta um relatório</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">extenso e telas sem</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">comportamento</text><text x="72" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">implementado.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#7c3aed"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Equipe Horizonte</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Demonstra uma avaliação</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">utilizável que calcula e</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">exibe a nota.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#7c3aed"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Próximo passo</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Horizonte mantém</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">instruções essenciais e</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">recolhe feedback da</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">demonstração.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Manifesto Ágil • Questão 2 • Analise as informações do cenário.</text></svg>