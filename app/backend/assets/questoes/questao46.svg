<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Um defeito não deve ser ocultado</title><desc id="desc">Definition of Done: Para concluir, os fluxos devem estar integrados e passar nos testes exigidos.; Falha encontrada: Quando o tempo termina, o portal aceita uma resposta enviada depois do encerramento.; Situação: O teste desse comportamento falha; a correção ainda está pendente.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#5b21b6"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Um defeito não deve ser ocultado</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#5b21b6"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Definition of Done</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Para concluir, os fluxos</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">devem estar integrados e</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">passar nos testes exigidos.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#5b21b6" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#5b21b6"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Falha encontrada</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Quando o tempo termina, o</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">portal aceita uma resposta</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">enviada depois do</text><text x="450" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">encerramento.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#5b21b6" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#5b21b6"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Situação</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">O teste desse</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">comportamento falha; a</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">correção ainda está</text><text x="828" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">pendente.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 12: Qualidade em Projetos Ágeis • Questão 2</text></svg>